<!DOCTYPE html>
<html>

<head>

    <title>Enter Amount</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 500px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .info {
            margin-bottom: 20px;
            font-size: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            appearance: none;
            margin: 0;
        }

        .error {
            background-color: #ffe5e5;
            color: #b00020;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        button,
        .cancel-button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            text-decoration: none;
        }

        button {
            background-color: #222;
            color: white;
        }

        .cancel-button {
            background-color: #ddd;
            color: #222;
        }

    </style>

</head>


<body>

<div class="container">

    <h2>Enter Amount</h2>

    <div class="info">

        <p>
            <strong>Person:</strong>
            {{ participant.name }}
        </p>

        <p>
            <strong>Month:</strong>
            {{ selected_month.month|date:"F Y" }}
        </p>

    </div>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label for="amount">
            Amount Paid
        </label>

        <input
            type="number"
            id="amount"
            name="amount"
            min="0.01"
            step="0.01"
            placeholder="Enter amount"
            required
            autofocus
        >


        <div class="buttons">

            <button type="submit">
                Save Payment
            </button>

            <a
                href="{% url 'chitti_detail' chitti.id %}?month={{ selected_month.id }}"
                class="cancel-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

</body>

</html>
