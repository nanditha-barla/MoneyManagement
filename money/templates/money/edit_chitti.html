<!DOCTYPE html>
<html>
<head>

    <title>Edit Chitti</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f6fa;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"] {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        /* Remove number input spinner arrows */

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            appearance: none;
            margin: 0;
        }

        .error {
            background: #ffe0e0;
            color: #b00000;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .participants-title {
            font-size: 22px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .participant-field {
            margin-bottom: 15px;
        }

        .participant-field label {
            font-size: 18px;
            margin-bottom: 7px;
        }

        .button-area {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }

        .save-button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .cancel-button {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 6px;
            background: #ddd;
            color: #222;
            text-decoration: none;
            font-size: 18px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Edit Chitti</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="form-group">

            <label for="chitti_name">
                Chitti Name
            </label>

            <input
                type="text"
                id="chitti_name"
                name="chitti_name"
                value="{{ chitti.name }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="number_of_persons">
                Number of Persons
            </label>

            <input
                type="number"
                id="number_of_persons"
                name="number_of_persons"
                value="{{ chitti.number_of_persons }}"
                min="1"
                required
            >

        </div>


        <div class="form-group">

            <label for="total_amount">
                Total Amount
            </label>

            <input
                type="number"
                id="total_amount"
                name="total_amount"
                value="{{ chitti.total_amount }}"
                step="0.01"
                min="0"
                required
            >

        </div>


        <div class="form-group">

            <label for="monthly_amount">
                Monthly Amount
            </label>

            <input
                type="number"
                id="monthly_amount"
                name="monthly_amount"
                value="{{ chitti.monthly_amount }}"
                step="0.01"
                min="0"
                required
            >

        </div>


        <div class="form-group">

            <label for="amount_after_taking">
                Amount After Taking Chitti
            </label>

            <input
                type="number"
                id="amount_after_taking"
                name="amount_after_taking"
                value="{{ chitti.amount_after_taking_chitti }}"
                step="0.01"
                min="0"
                required
            >

        </div>


        <div class="form-group">

            <label for="duration_months">
                Duration (Months)
            </label>

            <input
                type="number"
                id="duration_months"
                name="duration_months"
                value="{{ chitti.duration_months }}"
                min="1"
                required
            >

        </div>


        <div class="form-group">

            <label for="start_date">
                Start Date
            </label>

            <input
                type="date"
                id="start_date"
                name="start_date"
                value="{{ chitti.start_date|date:'Y-m-d' }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="starting_chitti_amount">
                Starting Chitti Amount
            </label>

            <input
                type="number"
                id="starting_chitti_amount"
                name="starting_chitti_amount"
                value="{{ chitti.starting_chitti_amount }}"
                step="0.01"
                min="0"
                required
            >

        </div>


        <div class="form-group">

            <label for="amount_to_be_added">
                Amount to be Added
            </label>

            <input
                type="number"
                id="amount_to_be_added"
                name="amount_to_be_added"
                value="{{ chitti.amount_to_be_added }}"
                step="0.01"
                min="0"
                required
            >

        </div>


        <div class="participants-title">
            Participant Names
        </div>

        <div id="participants-container">

            {% for participant in participants %}

                <div class="participant-field">

                    <label>
                        Participant {{ forloop.counter }}
                    </label>

                    <input
                        type="text"
                        name="participant_{{ forloop.counter0 }}"
                        value="{{ participant.name }}"
                        required
                    >

                </div>

            {% endfor %}

        </div>


        <div class="button-area">

            <button
                type="submit"
                class="save-button"
                id="save-button"
            >
                Save Changes
            </button>

            <a
                href="{% url 'home' %}"
                class="cancel-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>


<script>

    const numberOfPersonsInput =
        document.getElementById("number_of_persons");

    const participantsContainer =
        document.getElementById("participants-container");

    const saveButton =
        document.getElementById("save-button");


    function createParticipantFields() {

        const numberOfPersons =
            parseInt(numberOfPersonsInput.value) || 0;

        const existingInputs =
            Array.from(
                participantsContainer.querySelectorAll(
                    "input"
                )
            );

        const existingNames =
            existingInputs.map(
                input => input.value
            );

        participantsContainer.innerHTML = "";


        for (
            let i = 0;
            i < numberOfPersons;
            i++
        ) {

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "participant-field";


            const label =
                document.createElement("label");

            label.textContent =
                "Participant " + (i + 1);


            const input =
                document.createElement("input");

            input.type = "text";

            input.name =
                "participant_" + i;

            input.required = true;

            if (existingNames[i]) {

                input.value =
                    existingNames[i];

            }


            wrapper.appendChild(label);

            wrapper.appendChild(input);

            participantsContainer.appendChild(
                wrapper
            );


            input.addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        event.preventDefault();

                        const allInputs =
                            participantsContainer.querySelectorAll(
                                "input"
                            );

                        if (i < allInputs.length - 1) {

                            allInputs[i + 1].focus();

                        } else {

                            saveButton.focus();

                        }

                    }

                }
            );

        }

    }


    numberOfPersonsInput.addEventListener(
        "input",
        createParticipantFields
    );


    const initialParticipantCount =
        parseInt(numberOfPersonsInput.value) || 0;


    if (initialParticipantCount > 0) {

        createParticipantFields();

    }

</script>

</body>
</html>
